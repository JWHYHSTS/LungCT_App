// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Khắc phục triệt để giới hạn đường dẫn 260 ký tự (MAX_PATH) của CMake/Ninja trên Windows
// Phải đặt TRƯỚC `apply plugin: "expo-root-project"` để chạy trước khi các subproject hoàn tất đánh giá
subprojects { subproject ->
  if (System.getProperty("os.name").toLowerCase().contains("windows")) {
    def shortBase = new File(System.getProperty("java.io.tmpdir"), "lct_cxx")
    subproject.plugins.withId("com.android.library") {
      subproject.android {
        externalNativeBuild {
          cmake {
            buildStagingDirectory = new File(shortBase, subproject.name)
          }
        }
        defaultConfig {
          externalNativeBuild {
            cmake {
              arguments "-DCMAKE_OBJECT_PATH_MAX=100"
            }
          }
        }
      }
    }
    subproject.plugins.withId("com.android.application") {
      subproject.android {
        externalNativeBuild {
          cmake {
            buildStagingDirectory = new File(shortBase, subproject.name)
          }
        }
        defaultConfig {
          externalNativeBuild {
            cmake {
              arguments "-DCMAKE_OBJECT_PATH_MAX=100"
            }
          }
        }
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
